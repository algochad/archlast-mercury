services:
  mercury:
    # Default behaviour in a source checkout is unchanged: `build` policy +
    # local context means `docker compose up -d` builds from this tree.
    #
    # Two env overrides make the same file work with NO checkout:
    #   PARACORD_PULL_POLICY=missing   # pull ghcr.io image instead of building
    #   PARACORD_BUILD_CONTEXT=https://github.com/algochad/archlast-mercury.git#main
    #                                  # build straight from the remote repo
    # Example no-clone run:
    #   curl -fsSL -o docker-compose.yml \
    #     https://raw.githubusercontent.com/algochad/archlast-mercury/main/docker-compose.yml
    #   PARACORD_PULL_POLICY=missing docker compose up -d
    image: ghcr.io/algochad/archlast-mercury:latest
    pull_policy: ${PARACORD_PULL_POLICY:-build}
    build: ${PARACORD_BUILD_CONTEXT:-.}
    # No `container_name`: Coolify/Gaia suffixed this deployment's containers
    # (mercury-…-…) and the retry collided with the pinned name
    # ("postgres-… is already in use"). Compose generates stable
    # project-scoped names; service DNS (mercury, postgres, livekit) is unchanged.
    ports:
      # HTTP API + WebSocket gateway. Default is loopback-only for bare-metal safety.
      # For Coolify (Traefik routes to the container), either:
      #   - Use the Dockerfile resource (ports ignored, Traefik uses EXPOSE 8090), or
      #   - Set PARACORD_HOST_BIND=0.0.0.0 in .env when using the Compose resource.
      - "${PARACORD_HOST_BIND:-127.0.0.1}:8090:8090"
      # Native QUIC / WebTransport media (raw QUIC desktop + browser WebTransport).
      # Coolify/Traefik cannot proxy UDP — this must be published on the host
      # and opened on the VPS firewall separately (see docs/coolify.md).
      - "8443:8443/udp"
    volumes:
      - paracord-data:/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    environment:
      # Server
      - PARACORD_BIND_ADDRESS=0.0.0.0:8090
      - PARACORD_SERVER_NAME=localhost
      # - PARACORD_PUBLIC_URL=https://chat.example.com

      # Database — PostgreSQL by default. Requires POSTGRES_PASSWORD in .env
      # (generate: openssl rand -hex 32). SQLite remains available as fallback:
      # set MERCURY_DATABASE_ENGINE=sqlite + MERCURY_DATABASE_URL=sqlite:///data/mercury.db?mode=rwc.
      # (PARACORD_* aliases still work via server fallback.)
      # On Coolify with a managed Postgres resource, set MERCURY_DATABASE_URL
      # to that resource's internal URL instead (see docs/coolify.md).
      - MERCURY_DATABASE_URL=${MERCURY_DATABASE_URL:-postgresql://mercury:${POSTGRES_PASSWORD:-changeme}@postgres:5432/mercury}
      - MERCURY_DATABASE_ENGINE=${MERCURY_DATABASE_ENGINE:-postgres}
      - MERCURY_DATABASE_MAX_CONNECTIONS=${MERCURY_DATABASE_MAX_CONNECTIONS:-50}

      # Auth: no secret needed here. The server generates a strong random
      # jwt_secret on first run and persists it to /data/mercury.toml, then
      # reuses it on every restart. Nothing to set, nothing to leak in env.
      # (Falls back to /data/paracord.toml for backward compatibility.)
      - PARACORD_REGISTRATION_ENABLED=true

      # First-owner claim: until this server is claimed nobody can register,
      # which is what stops whoever finds the address first from owning it.
      # The one-time claim token is printed on startup (`docker compose logs
      # mercury`) and saved as /data/first-owner-claim.txt. Open
      # http://localhost:8090/setup-server and paste it.
      #
      # To pin the token in advance (provisioning, CI), uncomment and set at
      # least 32 random characters:
      # - PARACORD_SETUP_CLAIM_TOKEN=${PARACORD_SETUP_CLAIM_TOKEN:-}
      #
      # To skip the claim entirely for an unattended deployment where a script
      # you control creates the first account, uncomment the line below. The
      # FIRST account registered then owns this server:
      # - PARACORD_SETUP_REQUIRE_CLAIM=false

      # Voice: native QUIC/WebTransport media is the default and works with zero
      # configuration. LiveKit is an opt-in fallback (see the `livekit` profile).
      - PARACORD_VOICE_NATIVE_MEDIA=true

      # Storage
      - PARACORD_STORAGE_PATH=/data/uploads
      - PARACORD_MEDIA_STORAGE_PATH=/data/files

      # Backup
      - PARACORD_BACKUP_DIR=/data/backups

      # LiveKit (optional fallback): these are inert while native media is on.
      # They only take effect if you enable the `livekit` profile AND set
      # PARACORD_VOICE_NATIVE_MEDIA=false. The api_key id is not a secret, but
      # the shared secret has NO built-in default: you MUST set
      # PARACORD_LIVEKIT_API_SECRET in .env to a strong random value before
      # enabling the fallback. The same variable is read by the livekit service
      # below, so the two stay in sync. Leaving it unset makes the server refuse
      # to start (it will not silently fall back to a known shipped secret).
      - PARACORD_LIVEKIT_URL=ws://livekit:7880
      - PARACORD_LIVEKIT_HTTP_URL=http://livekit:7880
      - PARACORD_LIVEKIT_API_KEY=paracordlocal
      - PARACORD_LIVEKIT_API_SECRET=${PARACORD_LIVEKIT_API_SECRET:-}
      # - PARACORD_LIVEKIT_PUBLIC_URL=wss://chat.example.com/livekit

      # TLS: disabled inside Docker by default; the container serves plain HTTP
      # on 8090. Terminate TLS at a reverse proxy (Caddy/nginx) or set
      # PARACORD_TLS_ENABLED=true with mounted certs. Browsers block mic/camera
      # and screen-share on plain HTTP, so browser voice needs HTTPS in front;
      # the native desktop client speaks raw QUIC and does not.
      - PARACORD_TLS_ENABLED=false
    restart: unless-stopped
  # Optional LiveKit fallback. NOT started by default — bring it up explicitly
  # with `docker compose --profile livekit up -d` (and set
  # PARACORD_VOICE_NATIVE_MEDIA=false on the mercury service to route through it).
  livekit:
    image: livekit/livekit-server:v1.9.11
    profiles: ["livekit"]
    ports:
      # Published to the HOST LOOPBACK ONLY (127.0.0.1) so the media server is
      # never exposed to the LAN/WAN by default. Front it with your TLS reverse
      # proxy (which also serves the paracord service). Only widen these to
      # "7880:7880" etc. once you have set a strong PARACORD_LIVEKIT_API_SECRET
      # and accepted the risk of exposing the media server to the network.
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    environment:
      # Same secret the paracord service reads (the key id "paracordlocal" is not
      # a secret). There is NO built-in default: set PARACORD_LIVEKIT_API_SECRET
      # in .env to a strong random value before starting this profile. If it is
      # left unset the secret is empty, LiveKit will not authenticate, and the
      # paracord server refuses to start (see PARACORD_LIVEKIT_API_SECRET above).
      - "LIVEKIT_KEYS=paracordlocal: ${PARACORD_LIVEKIT_API_SECRET:-}"
    # NOTE: `--dev` is intentionally omitted. Dev mode enables LiveKit's built-in
    # devkey/secret pair and other insecure defaults; production/self-host must
    # authenticate only with the operator-provided PARACORD_LIVEKIT_API_SECRET.
    command: --bind 0.0.0.0
    restart: unless-stopped

  # PostgreSQL — primary database. Starts by default with `docker compose up -d`.
  # Requires POSTGRES_PASSWORD in .env (generate: openssl rand -hex 32).
  # Coolify: use a managed Postgres resource instead and point MERCURY_DATABASE_URL
  # at it (see docs/coolify.md); then remove this service or leave it stopped.
  postgres:
    image: postgres:16-alpine
    # (no container_name — see mercury service note above)
    environment:
      POSTGRES_DB: mercury
      POSTGRES_USER: mercury
      # Compose interpolates inactive-profile services too, so a `:?` guard here
      # would break SQLite zero-config (`docker compose config` with no .env).
      # Empty default instead: the postgres image itself refuses an empty
      # password at startup ("superuser password is not specified") — the
      # fail-fast. Never set a placeholder default; it would become real.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port mapping by default — internal only (mercury → postgres:5432).
    # To `psql` from the host, add temporarily:
    #   ports: ["127.0.0.1:5432:5432"]
    # or use: docker compose exec postgres psql -U mercury
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercury -d mercury"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  paracord-data:
  pgdata:
